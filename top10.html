<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Porsche Hunter Top 10</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#111}
header{padding:24px;background:#111;color:white}
main{max-width:1200px;margin:auto;padding:20px}
.card{display:grid;grid-template-columns:60px 320px 1fr;gap:18px;background:white;margin-bottom:18px;padding:16px;border-radius:16px}
.rank{font-size:28px;font-weight:bold}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos img,.empty{width:100%;height:120px;object-fit:cover;border-radius:10px;background:#ddd}
h2{margin:0 0 5px;font-size:21px}
a{color:#111}
.meta{color:#555;margin-bottom:10px}
.prices{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
.score{font-weight:bold;margin:9px 0}.why{margin:10px 0}.equipmentInfo{background:#f5f5f5;color:#555;padding:7px 9px;border-radius:8px;font-size:11px;margin:6px 0}.relativeRanks{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.relativeRanks span{background:#eeeeee;border-radius:10px;padding:4px 7px;font-size:11px;font-weight:600}.reasonGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7px}.reasonBox{padding:9px 11px;border-radius:10px;font-size:12px}.reasonBox.plus{background:#edf8ef;color:#185f2b}.reasonBox.minus{background:#fff0f0;color:#8e2020}.reasonBox ul{margin:6px 0 0 18px;padding:0}.reasonBox li{margin:3px 0}.none{margin-top:6px;color:#777}
.tags span{display:inline-block;background:#eee;padding:5px 8px;border-radius:12px;margin:3px;font-size:12px}
@media(max-width:800px){.card{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Porsche Hunter — Top 10</h1><div>04.09.2026, 15:00:50</div></header>
<main><p>Nicio mașină eligibilă.</p></main>
</body>
</html>
